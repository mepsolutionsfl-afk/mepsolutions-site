<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .logo-wrap {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: #1e2027;
    padding: 18px 32px;
    border-radius: 8px;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.15; }
  .logo-name {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 1.25rem;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.05em;
  }
  .logo-sub {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 0.62rem;
    font-weight: 600;
    color: #2979ff;
    letter-spacing: 0.18em;
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <svg width="46" height="41" viewBox="0 0 36 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polyline points="2,30 18,4 34,30" stroke="white" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline points="8,30 18,12 28,30" stroke="#2979ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="2" y1="30" x2="34" y2="30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div class="logo-text">
      <span class="logo-name">MEP SOLUTIONS</span>
      <span class="logo-sub">+ ARCHITECTURAL DRAFTING</span>
    </div>
  </div>
</body>
</html>
