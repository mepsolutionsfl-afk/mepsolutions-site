<!DOCTYPE html>
<html>
<head>
  <title>Download MEP Logo</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f0f0f0; gap: 24px; }
    canvas { border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); max-width: 600px; width: 100%; height: auto; }
    button { padding: 14px 40px; background: #2979ff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { background: #5393ff; }
    p { color: #666; font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <p>MEP Solutions — High Resolution Logo (3200 × 800px)</p>
  <canvas id="c" width="3200" height="800"></canvas>
  <button onclick="download()">Download High-Res PNG</button>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = 3200, H = 800;

    // Dark background
    ctx.fillStyle = '#1e2027';
    roundRect(ctx, 0, 0, W, H, 60);
    ctx.fill();

    // Triangle parameters
    const cx = 340, cy = H / 2;
    const triW = 280, triH = 320;

    // Outer triangle (white)
    ctx.beginPath();
    ctx.moveTo(cx - triW / 2, cy + triH / 2);
    ctx.lineTo(cx, cy - triH / 2);
    ctx.lineTo(cx + triW / 2, cy + triH / 2);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 24;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // Inner triangle (blue)
    ctx.beginPath();
    ctx.moveTo(cx - triW * 0.36, cy + triH / 2);
    ctx.lineTo(cx, cy - triH / 2 + triH * 0.38);
    ctx.lineTo(cx + triW * 0.36, cy + triH / 2);
    ctx.strokeStyle = '#2979ff';
    ctx.lineWidth = 24;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // Base line
    ctx.beginPath();
    ctx.moveTo(cx - triW / 2, cy + triH / 2);
    ctx.lineTo(cx + triW / 2, cy + triH / 2);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';
    ctx.stroke();

    // MEP text
    ctx.font = '800 220px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = 'white';
    ctx.fillText('MEP', 560, 460);

    // SOLUTIONS text
    ctx.font = '600 88px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#2979ff';
    ctx.letterSpacing = '12px';
    ctx.fillText('SOLUTIONS', 566, 570);

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function download() {
      const link = document.createElement('a');
      link.download = 'mep-solutions-logo-highres.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
